<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casper speaking practice</title>
<style>
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#122430; --muted:#5a6f7d; --line:#d3dde4;
  --accent:#1f4fd8; --accent-ink:#ffffff; --prep:#c98a00; --live:#d23a3a;
  --chip:#e1e9f0; --chip-on:#122430; --chip-on-ink:#eef2f5;
  --head:'Avenir Next','Segoe UI',system-ui,sans-serif; --body:Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1a22; --panel:#152631; --ink:#e6eef3; --muted:#93a8b6; --line:#27404f;
    --accent:#6f95ff; --accent-ink:#0b1620; --prep:#e6b13a; --live:#ff6b6b;
    --chip:#1e3442; --chip-on:#e6eef3; --chip-on-ink:#0e1a22;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:20px 18px 64px}
h1,h2,.label{font-family:var(--head);letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.1;margin:8px 0 6px}
h2{font-size:1.25rem;margin:0 0 10px}
p{margin:0 0 12px}
.sub{color:var(--muted);margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.label{font-size:.9rem;font-weight:700;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .9rem var(--head);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
textarea,input[type=number]{width:100%;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:84px;resize:vertical}
.toggle{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.98rem}
.toggle input{margin-top:6px;width:18px;height:18px;flex:none}
.small{font-size:.88rem;color:var(--muted)}
button.primary,button.ghost{font:700 1rem var(--head);border-radius:12px;padding:14px 20px;cursor:pointer;min-height:48px;border:1px solid transparent}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.primary:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.scene{font-size:1.15rem;line-height:1.6}
.scene .q{font-family:var(--head);font-weight:700;font-size:1.12rem;line-height:1.35;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.scene .q.solo{border:0;margin:0;padding:0}
.tag{display:inline-block;font:600 .8rem var(--head);background:var(--chip);border-radius:6px;padding:3px 9px;margin-bottom:10px}
.timerbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:700 2rem var(--head)}
.phase{font:700 1.05rem var(--head)}
.phase.prep{color:var(--prep)} .phase.live{color:var(--live)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--live);margin-right:8px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.transcript{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:60px;font-size:1rem;color:var(--muted);margin-top:14px}
.transcript.done{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{font:700 1.4rem var(--head);display:block}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check input{margin-top:6px;width:18px;height:18px;flex:none}
.hint{background:var(--bg);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;font-size:1rem}
audio{width:100%;margin-top:8px}
.hist{width:100%;border-collapse:collapse;font-size:.95rem}
.hist td,.hist th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.hist th{font-family:var(--head);font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
.beats{margin:0 0 10px;padding-left:20px}
.beats li{margin-bottom:6px}
</style>
</head>
<body>
<main id="app"></main>

<script>
const REFLECT = "Reflect on your own experience.";
const SCENARIOS = [
 {id:1,cat:"Ethics",scene:"You're a student volunteer at a community clinic. A friend who also volunteers tells you she has been quietly helping a patient with paperwork after hours, which is against the clinic's rules. She says nobody is harmed and asks you not to mention it.",q:"What would you do, and why?",hint:"Weigh loyalty to your friend against the clinic's rules and the patient's protection. A strong answer usually talks to the friend first, then names when you would escalate."},
 {id:2,cat:"Ethics",scene:"During a group project, you discover that a teammate copied several paragraphs from an online source. The deadline is tomorrow. If you report it, the whole group may lose marks.",q:"How would you handle this situation?",hint:"Address the teammate directly, give a chance to fix it, consider the group's exposure, and say what you'd do if they refuse."},
 {id:3,cat:"Ethics",scene:"You are a cashier at a pharmacy. An older customer is short by a few dollars for a needed medication and asks whether you can just let it go. Store policy says no exceptions.",q:"What are the competing considerations here, and what would you do?",hint:"Name both sides (policy fairness vs. the customer's need), then find options within your role: a manager, a payment plan, a cheaper alternative."},
 {id:4,cat:"Ethics",scene:"A classmate confides that she has been stretching her medication out because she can't afford refills. She begs you not to tell anyone, including her family.",q:"What would you do?",hint:"Balance confidentiality with safety. Show you'd encourage her to seek help and explain honestly why you can't just sit on this."},
 {id:5,cat:"Teamwork",scene:"You're leading a team of four for a class presentation. One member has missed two meetings and hasn't done his section. The others are frustrated and want to cut him out completely.",q:"How would you approach this as the team lead?",hint:"Check in privately to understand why, set a clear expectation and deadline, and plan a fallback so the group isn't sunk."},
 {id:6,cat:"Teamwork",scene:"On a volunteer shift, your supervisor asks you to do a task in a way you believe is less safe than another method you learned in training.",q:"What would you do, and how would you communicate it?",hint:"Show respect for hierarchy while being clear on safety. Ask a question rather than accuse, and say what you'd do if the concern is dismissed."},
 {id:7,cat:"Teamwork",scene:"Your team just received a poor grade on a big project. Two members are blaming each other in the group chat and the tension is spreading.",q:"What role would you take in the group?",hint:"De-escalate, move the conversation from blame to what to change next time, and take ownership of your own part."},
 {id:8,cat:"Teamwork",scene:"You've been working at a restaurant for a year. A new coworker is struggling and slowing down the kitchen. Other staff are starting to snap at her.",q:"What would you do?",hint:"Empathy for the newcomer, practical help (pair up, show her the system), and a calm word with the others."},
 {id:9,cat:"Conflict",scene:"Your roommate has been having friends over late every night during your exam period. You've hinted twice, but nothing has changed.",q:"How would you resolve this?",hint:"A direct, kind conversation with a specific request and a compromise. Avoid passive aggression. Mention what you'd do if it continues."},
 {id:10,cat:"Conflict",scene:"A professor gave you a grade you believe is unfair. Your friend says you should post about it online to pressure the department.",q:"What would you do?",hint:"Use proper channels first: review the rubric, ask for a meeting, escalate calmly if needed. Explain why public pressure is a poor first step."},
 {id:11,cat:"Conflict",scene:"At work, a colleague keeps taking credit for ideas you raise in meetings. Your manager seems to have noticed only her contributions.",q:"How would you deal with this?",hint:"Assume good intent first, speak to the colleague directly, and make your contributions visible in a constructive way."},
 {id:12,cat:"Conflict",scene:"You and a close friend both want the same leadership position in a club you belong to. You've just learned that she is also planning to apply.",q:"How do you handle this while protecting the friendship?",hint:"Be open about your intentions, agree that either result is fine, and commit to supporting the winner."},
 {id:13,cat:"Empathy",scene:"A younger cousin tells you she's failing high school math and feels stupid. She says there's no point trying anymore.",q:"How would you respond to her?",hint:"Listen before fixing. Validate the feeling, separate ability from current results, and offer concrete, small next steps."},
 {id:14,cat:"Empathy",scene:"At a community event, you notice an elderly man who seems confused and increasingly upset. Others are walking past.",q:"What would you do?",hint:"Approach calmly, get down to his level, ask simple questions, and know when to bring in staff or emergency help."},
 {id:15,cat:"Empathy",scene:"A friend has just been turned down by every medical school she applied to. She says she wants to be left alone.",q:"How would you support her?",hint:"Respect her space while staying present. A short, low-pressure message often beats a long pep talk."},
 {id:16,cat:"Empathy",scene:"A patient at the hospital where you volunteer refuses to speak to you and snaps that volunteers are useless.",q:"How would you respond?",hint:"Don't take it personally. Recognize the fear or frustration underneath, respond calmly, and know your limits."},
 {id:17,cat:"Communication",scene:"You have to explain to a nervous grandparent why a family member's surgery is being delayed. You only have a few facts and none of them are reassuring.",q:"How would you communicate this?",hint:"Be honest, simple, and warm. Say what you know and don't know, and what happens next."},
 {id:18,cat:"Communication",scene:"You've been asked to give feedback to a peer whose presentation was disorganized. She's clearly proud of how it went.",q:"What would you say to her, and how?",hint:"Start with something genuine, be specific about the issue, and frame feedback as helping her next time."},
 {id:19,cat:"Communication",scene:"You realize you gave a friend wrong information about a scholarship deadline. She may already have missed it.",q:"What would you do?",hint:"Tell her right away, own it without over-apologizing, and help find any way to fix it."},
 {id:20,cat:"Personal",scene:REFLECT,q:"Tell us about a time you made a mistake that affected other people. What did you do about it, and what did you learn?",hint:"Pick a real, specific example. Spend most of your time on what you did and changed afterward, not on the story itself."},
 {id:21,cat:"Personal",scene:REFLECT,q:"Describe a time you disagreed with someone in authority. How did you handle it?",hint:"Show respect and judgment. A clear outcome matters less than how you thought it through."},
 {id:22,cat:"Personal",scene:REFLECT,q:"Tell us about a situation in which you had to support someone going through something difficult.",hint:"Focus on what the person needed, what you actually did, and what it taught you about yourself."},
 {id:23,cat:"Personal",scene:REFLECT,q:"What is a personal quality you need to work on, and what are you doing about it?",hint:"Choose a real weakness, not a disguised strength. Give one concrete example of progress."},
 {id:24,cat:"Personal",scene:REFLECT,q:"Describe a time you had to work with someone whose values or background were very different from yours.",hint:"Show curiosity rather than judgment, and describe a specific moment where your view shifted or widened."}
];
const CATS = ["Ethics","Teamwork","Conflict","Empathy","Communication","Personal"];
const FILLERS = ["um","uh","like","you know","basically","actually","kind of","sort of","i mean"];
const RUBRIC = [
 "I named the core problem or tension early",
 "I considered at least two people's perspectives",
 "I took a clear position or action",
 "I gave the reason behind it",
 "I acknowledged a downside or tradeoff",
 "I spoke steadily without long stalls",
 "I wrapped up clearly before time ran out"
];

const S = {
  cats:new Set(CATS), prep:30, speak:60, record:true, transcribe:true,
  used:new Set(), cur:null, phase:null, endAt:0, total:0, timer:null,
  stream:null, mr:null, chunks:[], audioUrl:null, mediaMsg:"",
  sr:null, srActive:false, transcript:"", speakStart:0, speakSecs:0
};
const app = document.getElementById("app");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loadHist(){try{return JSON.parse(localStorage.getItem("casper-hist")||"[]")}catch(e){return []}}
function saveHist(h){try{localStorage.setItem("casper-hist",JSON.stringify(h.slice(-200)))}catch(e){}}

function pickNext(){
  const pool = SCENARIOS.filter(s=>S.cats.has(s.cat));
  if(!pool.length) return null;
  let fresh = pool.filter(s=>!S.used.has(s.id));
  if(!fresh.length){ pool.forEach(s=>S.used.delete(s.id)); fresh = pool; }
  const s = fresh[Math.floor(Math.random()*fresh.length)];
  S.used.add(s.id);
  return s;
}

function releaseStream(){
  if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
}

function home(){
  const h = loadHist();
  const avg = h.length ? (h.reduce((a,b)=>a+b.score,0)/h.length).toFixed(1) : "–";
  const last5 = h.slice(-5);
  const avg5 = last5.length ? (last5.reduce((a,b)=>a+b.score,0)/last5.length).toFixed(1) : "–";
  app.innerHTML = `
  <h1>Casper speaking practice</h1>
  <p class="sub">Random scenarios, a prep timer, a speaking timer, and a self-review after each answer. Record yourself and listen back. It's the fastest way to hear what the assessors will hear.</p>

  <div class="card">
    <span class="label">Scenario types</span>
    <div class="chips">
      ${CATS.map(c=>`<button class="chip" aria-pressed="${S.cats.has(c)}" data-cat="${c}">${c}</button>`).join("")}
    </div>
    <div class="row" style="margin-top:18px">
      <div><label class="label" for="prep">Prep time (seconds)</label><input type="number" id="prep" min="0" max="120" value="${S.prep}"></div>
      <div><label class="label" for="speak">Speaking time (seconds)</label><input type="number" id="speak" min="20" max="300" value="${S.speak}"></div>
    </div>
    <p class="small" style="margin-top:8px">Set these to match the format of the test. A slightly tighter clock than the real thing is good practice.</p>
    <label class="toggle"><input type="checkbox" id="rec" ${S.record?"checked":""}><span>Record my answer so I can play it back (stays on this device)</span></label>
    <label class="toggle"><input type="checkbox" id="tr" ${S.transcribe&&SR?"checked":""} ${SR?"":"disabled"}><span>Live transcript and filler-word count${SR?"":" (not supported in this browser; try Chrome or Safari)"}. <span class="small">The browser may send audio to its speech service to do this.</span></span></label>
    <div class="actions"><button class="primary" id="start">Start a scenario</button></div>
  </div>

  <div class="card">
    <h2>A simple shape for any answer</h2>
    <ol class="beats">
      <li><b>Name the tension.</b> Say in one sentence what makes this hard.</li>
      <li><b>Consider the people.</b> Who is affected, and how does each of them see it?</li>
      <li><b>Choose an action and give your reason.</b> Be specific about what you'd do first.</li>
      <li><b>Own the tradeoff.</b> Acknowledge what you'd risk or give up, then close.</li>
    </ol>
    <p class="small">There's no single right answer. Assessors look for judgment, empathy, and clear communication more than a perfect solution. In prep time, jot down only 3 or 4 keywords.</p>
  </div>

  <div class="card">
    <h2>Your practice so far</h2>
    ${h.length ? `
      <div class="stats">
        <div class="stat"><b>${h.length}</b>answers</div>
        <div class="stat"><b>${avg}/7</b>avg self-score</div>
        <div class="stat"><b>${avg5}/7</b>last 5 avg</div>
      </div>
      <div class="tablewrap"><table class="hist"><thead><tr><th>Type</th><th>Score</th><th>Words</th><th>Fillers</th><th>Note</th></tr></thead><tbody>
      ${h.slice(-8).reverse().map(x=>`<tr><td>${esc(x.cat)}</td><td>${x.score}/7</td><td>${x.words==null?"–":x.words}</td><td>${x.fillers==null?"–":x.fillers}</td><td>${esc(x.note||"")}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="actions"><button class="ghost" id="clear">Clear history</button></div>`
      : `<p class="small">Nothing yet. Your self-scores and notes show up here after your first answer.</p>`}
  </div>`;

  const startBtn = document.getElementById("start");
  startBtn.disabled = S.cats.size===0;
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.cat; S.cats.has(c)?S.cats.delete(c):S.cats.add(c);
    b.setAttribute("aria-pressed",S.cats.has(c));
    startBtn.disabled = S.cats.size===0;
  });
  startBtn.onclick=()=>{
    S.prep = Math.max(0,Math.min(120,parseInt(document.getElementById("prep").value,10)||0));
    S.speak = Math.max(20,Math.min(300,parseInt(document.getElementById("speak").value,10)||60));
    S.record = document.getElementById("rec").checked;
    S.transcribe = document.getElementById("tr").checked && !!SR;
    beginScenario(true);
  };
  const cl = document.getElementById("clear");
  if(cl) cl.onclick=()=>{ if(confirm("Clear all saved practice history?")){ saveHist([]); home(); } };
}

async function requestMic(){
  if(!S.record) return;
  try{
    S.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    S.stream = null;
    S.mediaMsg = "Recording isn't available (microphone blocked or unsupported). Allow microphone access in your browser to record. The timers still work.";
    const m=document.getElementById("media"); if(m) m.textContent=S.mediaMsg;
  }
}

function beginScenario(newOne){
  if(newOne){ S.cur = pickNext(); }
  if(!S.cur) return;
  S.transcript=""; S.audioUrl=null; S.chunks=[]; S.mediaMsg="";
  runView("prep");
  requestMic();
}

function sceneCard(){
  const c=S.cur, solo = c.scene===REFLECT;
  return `<div class="card scene"><span class="tag">${esc(c.cat)}</span>
    ${solo?"":`<p>${esc(c.scene)}</p>`}
    <div class="q ${solo?"solo":""}">${esc(c.q)}</div></div>`;
}

function runView(phase){
  clearInterval(S.timer);
  if(phase==="prep" && S.prep===0){ phase="speak"; }
  S.phase = phase;
  const total = phase==="prep" ? S.prep : S.speak;
  S.total = total;
  const isPrep = phase==="prep";
  app.innerHTML = `
    ${sceneCard()}
    <div class="card">
      <div class="timerbox">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="58" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="arc" cx="66" cy="66" r="58" fill="none" stroke="${isPrep?"var(--prep)":"var(--live)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="0"/>
          </svg>
          <div class="t" id="clock">${total}</div>
        </div>
        <div>
          <div class="phase ${isPrep?"prep":"live"}">${isPrep?"Prep time: jot 3 or 4 keywords":`<span class="dot"></span>Speak now`}</div>
          <p class="small" id="media" style="margin:6px 0 0">${esc(S.mediaMsg)}</p>
          <div class="actions" style="margin-top:10px">
            ${isPrep?`<button class="primary" id="go">Start speaking now</button>`:`<button class="primary" id="done">I'm done</button>`}
            <button class="ghost" id="quit">Quit</button>
          </div>
        </div>
      </div>
      ${!isPrep && S.transcribe ? `<div class="transcript" id="tx">Listening…</div>`:""}
    </div>`;
  document.getElementById("quit").onclick=()=>{ stopAll(); home(); };
  if(isPrep){ document.getElementById("go").onclick=()=>runView("speak"); }
  else { document.getElementById("done").onclick=finishSpeaking; startCapture(); }
  S.endAt = Date.now()+total*1000;
  S.timer=setInterval(tick,200);
}

function tick(){
  const left = Math.max(0,(S.endAt-Date.now())/1000);
  const clock=document.getElementById("clock"), arc=document.getElementById("arc");
  if(!clock) return;
  clock.textContent = Math.ceil(left);
  arc.setAttribute("stroke-dashoffset", (364.4*(1-left/S.total)).toFixed(1));
  if(left<=0){
    clearInterval(S.timer);
    if(S.phase==="prep") runView("speak"); else finishSpeaking();
  }
}

function startCapture(){
  S.speakStart = Date.now();
  if(S.stream && window.MediaRecorder){
    try{
      S.mr = new MediaRecorder(S.stream);
      S.chunks=[];
      S.mr.ondataavailable=e=>{ if(e.data && e.data.size) S.chunks.push(e.data); };
      S.mr.start();
    }catch(e){ S.mr=null; }
  }
  if(S.transcribe && SR){
    try{
      const r = new SR(); r.continuous=true; r.interimResults=true; r.lang="en-US";
      let finalText="";
      r.onresult=ev=>{
        let interim="";
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const t=ev.results[i][0].transcript;
          if(ev.results[i].isFinal) finalText+=t+" "; else interim+=t;
        }
        S.transcript = (finalText+interim).trim();
        const tx=document.getElementById("tx"); if(tx) tx.textContent = S.transcript || "Listening…";
      };
      r.onend=()=>{ if(S.srActive){ try{r.start()}catch(e){} } };
      r.onerror=()=>{};
      S.sr=r; S.srActive=true; r.start();
    }catch(e){ S.sr=null; S.srActive=false; }
  }
}

function stopAll(){
  clearInterval(S.timer);
  S.srActive=false;
  try{ S.sr && S.sr.stop(); }catch(e){}
  try{ S.mr && S.mr.state!=="inactive" && S.mr.stop(); }catch(e){}
  S.mr=null; S.sr=null;
  releaseStream();
}

function finishSpeaking(){
  clearInterval(S.timer);
  S.speakSecs = Math.max(1,Math.round((Date.now()-S.speakStart)/1000));
  S.srActive=false;
  try{ S.sr && S.sr.stop(); }catch(e){}
  const mr = S.mr; S.mr=null;
  const done = ()=>{
    releaseStream();
    if(S.chunks.length){ S.audioUrl = URL.createObjectURL(new Blob(S.chunks,{type:S.chunks[0].type||"audio/webm"})); }
    review();
  };
  if(mr && mr.state!=="inactive"){
    mr.onstop=done;
    try{ mr.stop(); }catch(e){ done(); }
  } else { done(); }
}

function analyse(){
  const txt=S.transcript.toLowerCase();
  if(!txt) return null;
  const words = txt.split(/\s+/).filter(Boolean).length;
  let fillers=0;
  FILLERS.forEach(f=>{ const m=txt.match(new RegExp("\\b"+f+"\\b","g")); if(m) fillers+=m.length; });
  return {words, fillers, wpm:Math.round(words/(S.speakSecs/60))};
}

function review(){
  const a = analyse();
  app.innerHTML = `
    ${sceneCard()}
    <div class="card">
      <h2>Listen back</h2>
      ${S.audioUrl?`<audio controls src="${S.audioUrl}"></audio>`:`<p class="small">${S.record?"No recording was captured. "+esc(S.mediaMsg):"Recording was off for this round."}</p>`}
      <div class="stats">
        <div class="stat"><b>${S.speakSecs}s</b>spoke of ${S.speak}s</div>
        ${a?`<div class="stat"><b>${a.words}</b>words</div><div class="stat"><b>${a.wpm}</b>words/min</div><div class="stat"><b>${a.fillers}</b>filler words</div>`:""}
      </div>
      ${a?`<p class="small">A comfortable speaking pace is roughly 120 to 160 words a minute. Transcripts are approximate, so treat the counts as a rough guide.</p>
      <div class="transcript done">${esc(S.transcript)}</div>`:""}
    </div>
    <div class="card">
      <h2>Score yourself honestly</h2>
      ${RUBRIC.map(r=>`<label class="check"><input type="checkbox" class="rb"><span>${esc(r)}</span></label>`).join("")}
      <label class="label" for="note" style="margin-top:14px">One thing to do better next time</label>
      <textarea id="note" placeholder="e.g. I jumped to the solution without naming the other person's side"></textarea>
    </div>
    <div class="card">
      <h2>What a strong answer often includes</h2>
      <div class="hint">${esc(S.cur.hint)}</div>
    </div>
    <div class="actions">
      <button class="primary" id="next">Save and do another</button>
      <button class="ghost" id="save">Save and finish</button>
      <button class="ghost" id="retry">Retry this scenario</button>
    </div>`;
  const persist=()=>{
    const score=[...document.querySelectorAll(".rb")].filter(c=>c.checked).length;
    const h=loadHist();
    h.push({t:Date.now(),id:S.cur.id,cat:S.cur.cat,score,words:a?a.words:null,fillers:a?a.fillers:null,note:document.getElementById("note").value.trim()});
    saveHist(h);
  };
  document.getElementById("next").onclick=()=>{persist();beginScenario(true);};
  document.getElementById("save").onclick=()=>{persist();home();};
  document.getElementById("retry").onclick=()=>beginScenario(false);
}

home();
</script>
</body>
</html>
